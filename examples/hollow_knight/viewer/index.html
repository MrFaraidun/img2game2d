<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hollow Knight — 2D Game Asset Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-badge">2D ASSET RUNTIME</div>
        <h1 class="brand-title">Hollow Knight <span>Studio</span></h1>
      </div>
      <div class="header-status">
        <div class="status-pill passed">
          <span class="dot"></span> 20/20 Stages Verified
        </div>
        <div class="status-pill score">
          Silhouette IoU: <strong>0.947</strong>
        </div>
        <div class="status-pill score">
          Color: <strong>0.968</strong>
        </div>
        <div class="status-pill score">
          Continuity: <strong>0.903</strong>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="playground-layout">
      <!-- Game Stage (Left) -->
      <section class="stage-container">
        <div class="stage-wrapper">
          <canvas id="gameCanvas" width="960" height="540"></canvas>
          <div class="stage-overlay">
            <div class="key-hints">
              <span class="key-tag"><kbd>A</kbd><kbd>D</kbd> Move</span>
              <span class="key-tag"><kbd>SPACE</kbd> Jump</span>
              <span class="key-tag"><kbd>J</kbd> Attack</span>
              <span class="key-tag"><kbd>K</kbd> Hurt</span>
            </div>
            <div class="action-mode-badge" id="currentActionBadge">IDLE</div>
          </div>
        </div>

        <!-- Timeline & Playback Bar -->
        <div class="playback-bar glass-panel">
          <div class="playback-controls">
            <button id="btnPlayPause" class="btn-icon" title="Play/Pause">
              <svg id="iconPlay" viewBox="0 0 24 24" width="18" height="18"><polygon points="6,4 20,12 6,20" fill="currentColor"/></svg>
              <svg id="iconPause" viewBox="0 0 24 24" width="18" height="18" style="display:none;"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>
            </button>
            <button id="btnPrevFrame" class="btn-icon" title="Previous Frame">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18 18L10 12L18 6V18ZM8 6H6V18H8V6Z" fill="currentColor"/></svg>
            </button>
            <button id="btnNextFrame" class="btn-icon" title="Next Frame">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6L14 12L6 18V6ZM16 6H18V18H16V6Z" fill="currentColor"/></svg>
            </button>
            <span class="frame-counter" id="frameCounter">Frame 1 / 4</span>
          </div>

          <div class="timeline-slider-wrapper">
            <input type="range" id="frameSlider" min="0" max="3" value="0" step="1" class="timeline-slider">
          </div>

          <div class="speed-selector">
            <label>Speed:</label>
            <button class="btn-chip" data-speed="0.25">0.25x</button>
            <button class="btn-chip" data-speed="0.5">0.5x</button>
            <button class="btn-chip active" data-speed="1.0">1x</button>
            <button class="btn-chip" data-speed="1.5">1.5x</button>
          </div>
        </div>
      </section>

      <!-- Inspector Panel (Right) -->
      <aside class="inspector-panel glass-panel">
        <!-- Tab Navigation -->
        <nav class="tab-nav">
          <button class="tab-btn active" data-tab="animations">Animations</button>
          <button class="tab-btn" data-tab="layers">Layers & Rig</button>
          <button class="tab-btn" data-tab="exports">Engines</button>
        </nav>

        <!-- Tab 1: Animations -->
        <div class="tab-content active" id="tabAnimations">
          <div class="section-title">Select Clip</div>
          <div class="clip-grid">
            <button class="clip-card active" data-clip="idle">
              <div class="clip-name">Idle</div>
              <div class="clip-meta">4 frames · 8 fps · Loop</div>
            </button>
            <button class="clip-card" data-clip="walk">
              <div class="clip-name">Walk</div>
              <div class="clip-meta">8 frames · 12 fps · Loop</div>
            </button>
            <button class="clip-card" data-clip="attack">
              <div class="clip-name">Attack</div>
              <div class="clip-meta">6 frames · 14 fps · Once</div>
            </button>
            <button class="clip-card" data-clip="jump">
              <div class="clip-name">Jump</div>
              <div class="clip-meta">6 frames · 10 fps · Once</div>
            </button>
            <button class="clip-card" data-clip="hurt">
              <div class="clip-name">Hurt</div>
              <div class="clip-meta">4 frames · 10 fps · Once</div>
            </button>
          </div>

          <div class="section-title" style="margin-top: 20px;">Display Overlays</div>
          <div class="toggle-group">
            <label class="toggle-switch">
              <input type="checkbox" id="toggleHitbox">
              <span class="slider"></span>
              <span class="toggle-label">Bounding Box & Pivot</span>
            </label>
            <label class="toggle-switch">
              <input type="checkbox" id="toggleSkeleton">
              <span class="slider"></span>
              <span class="toggle-label">Skeletal Rig Bones</span>
            </label>
            <label class="toggle-switch">
              <input type="checkbox" id="toggleOnion">
              <span class="slider"></span>
              <span class="toggle-label">Onion Skinning (Ghost)</span>
            </label>
            <label class="toggle-switch">
              <input type="checkbox" id="toggleMute" checked>
              <span class="slider"></span>
              <span class="toggle-label">Audio SFX (Synthesized)</span>
            </label>
          </div>

          <div class="section-title" style="margin-top: 20px;">Manual Controls</div>
          <div class="action-buttons-grid">
            <button class="btn-action" id="btnActionWalk">Walk Cycle</button>
            <button class="btn-action" id="btnActionJump">Jump Leap</button>
            <button class="btn-action primary" id="btnActionAttack">Nail Slash</button>
            <button class="btn-action danger" id="btnActionHurt">Damage Recoil</button>
          </div>
        </div>

        <!-- Tab 2: Layers & Rig -->
        <div class="tab-content" id="tabLayers">
          <div class="section-title">Decomposed Layers (5 Parts)</div>
          <div class="layer-list" id="layerListContainer">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Tab 3: Engines -->
        <div class="tab-content" id="tabExports">
          <div class="section-title">Engine Integration Code</div>
          <div class="engine-tabs">
            <button class="engine-tab-btn active" data-engine="godot">Godot 4</button>
            <button class="engine-tab-btn" data-engine="unity">Unity</button>
            <button class="engine-tab-btn" data-engine="phaser">Phaser 3</button>
            <button class="engine-tab-btn" data-engine="pixijs">PixiJS</button>
          </div>
          <pre class="code-box"><code id="engineCodeSnippet"></code></pre>
          <div class="export-paths">
            <div class="export-file-tag">📁 work/hollow_knight/exports/</div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
